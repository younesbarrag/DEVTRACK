## Appendix — Known Non-Existent Data Consistency

These are not features but data-model gaps documented for completeness. They are rooted in code that reads one column while writing another, so the "assigned developer" feature effectively does not work end-to-end:

* `tasks.assigned_to` is written by the seeders/`TaskSeeder` and read by `Task::user()` / `User::tasks()` (`Task.php:59`, `User.php:42`).
* `tasks.user_id` is written by controllers, `TaskFactory`, and `TaskResource` (`TaskController.php:30,55`, `TaskFactory.php:33`, `TaskResource.php:24`) — this column is NOT read by any relationship.
* As a result, tasks created through the UI have no readable assignee: dashboard "My Tasks", the assignee dropdown default, `TaskPolicy` checks, and API `user` payload all return empty/null for them.
