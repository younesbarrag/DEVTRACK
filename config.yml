## US2 — Dashboard

Requirements:

* Display projects where the authenticated user is a lead or project member.
* Display total tasks per project.
* Display completed tasks per project.
* Display dashboard statistics.
* Prevent users from seeing unauthorized project information.

Inspect:

* Dashboard route and controller
* Dashboard Blade view
* Project and Task relationships
* Database queries
* Authorization logic
* Potential N+1 query problems

Check whether the dashboard currently shows only lead-owned projects instead of all projects where the user is a member.

