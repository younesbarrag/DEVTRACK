## Step 1 — Inspect the Project Structure

Inspect the relevant project files, including:

* app/Models/
* app/Http/Controllers/
* app/Http/Requests/
* app/Http/Resources/
* app/Policies/
* database/migrations/
* database/seeders/
* routes/web.php
* routes/api.php (if available)
* resources/views/
* tests/ (if available)
* composer.json
* Laravel authentication configuration
* Sanctum configuration (if installed)

Also inspect the project's actual database column names, relationships, route definitions, and authentication configuration.

Do not assume that a file or feature exists based only on its name.

---

## Step 2 — Audit Every User Story

Review the following User Stories individually.

For each User Story, report:

1. User Story ID and title
2. Status: COMPLETED / PARTIALLY COMPLETED / NOT IMPLEMENTED / NEEDS VERIFICATION
3. Evidence: exact file paths, relevant classes, methods, routes, migrations, and tests
4. What is working
5. What is missing or incorrect
6. Required next steps
7. Suggested manual test or automated test

Do not mark a feature as completed only because a method or route exists. Check whether its behavior satisfies the requirements and authorization rules.

